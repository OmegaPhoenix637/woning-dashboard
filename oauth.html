<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Koppelcode</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #070b14; color: #e9edf5;
         font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; padding: 16px; box-sizing: border-box; }
  .card { max-width: 520px; width: 100%; background: #111a2c; border: 1px solid rgba(255,255,255,.08); border-radius: 20px; padding: 28px; }
  h1 { font-size: 22px; margin: 0 0 8px; }
  p { color: #a9b3c7; margin: 0 0 16px; }
  code { display: block; word-break: break-all; background: #0a1120; border-radius: 12px; padding: 14px; font-size: 15px; color: #fff; }
  button { margin-top: 14px; border: 0; border-radius: 999px; padding: 12px 20px; font: inherit; font-weight: 600; background: #3d8ef0; color: #fff; cursor: pointer; }
</style>
</head>
<body>
<div class="card">
  <h1>Koppelcode ontvangen</h1>
  <p>Kopieer deze code en plak hem op de instelpagina van de ESP32 (<b>http://energie.local</b>). De code is maar een paar minuten geldig.</p>
  <code id="c">—</code>
  <button id="b" type="button">Kopiëren</button>
</div>
<script>
  // Deze pagina is de "redirect URI" voor de Daikin Onecta-koppeling.
  // De code wordt alleen getoond, nergens naartoe gestuurd.
  var p = new URLSearchParams(location.search);
  var code = p.get('code') || ('Fout: ' + (p.get('error_description') || p.get('error') || 'geen code'));
  document.getElementById('c').textContent = code;
  document.getElementById('b').onclick = function () {
    navigator.clipboard.writeText(code).then(function () { document.getElementById('b').textContent = 'Gekopieerd ✓'; });
  };
</script>
</body>
</html>
