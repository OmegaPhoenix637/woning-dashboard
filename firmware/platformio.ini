; Mijn Woning – ESP32-WROOM-32 datalogger (alleen-lezen)
; Flashen via USB:  pio run -t upload   |   Bestandssysteem leegmaken: pio run -t erase
[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
; Geen OTA: grote app-partitie + ~2 MB LittleFS als buffer (zie partitions.csv)
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
build_flags =
  -DCORE_DEBUG_LEVEL=1
  -DARDUINOJSON_USE_DOUBLE=0
  -DARDUINOJSON_USE_LONG_LONG=1
lib_deps =
  bblanchon/ArduinoJson@7.2.1
